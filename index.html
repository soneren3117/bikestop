<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BikeStop — バイク駐輪場検索</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0c10;--surface:#12151c;--surface2:#1a1e28;--border:#252a38;
      --accent:#ff5c1a;--accent2:#ffaa00;--text:#e8eaf0;--text2:#8892a4;
      --green:#2ecc71;--red:#e74c3c;--yellow:#f39c12;--blue:#4a9eff;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;}
    body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column;}

    /* HEADER */
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;flex-shrink:0;z-index:20;}
    .header-inner{display:flex;align-items:center;gap:10px;}
    .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;white-space:nowrap;display:flex;align-items:center;gap:6px;}
    .logo-icon{background:var(--accent);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px;}
    .logo span{color:var(--accent);}
    .search-bar{flex:1;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0 10px;gap:6px;height:38px;transition:border-color .2s;}
    .search-bar:focus-within{border-color:var(--accent);}
    .search-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;}
    .search-bar input::placeholder{color:var(--text2);}
    .gps-btn{background:var(--accent);border:none;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;transition:.2s;}
    .gps-btn:active{transform:scale(.93);}

    /* DATETIME BAR */
    .datetime-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:7px 12px;flex-shrink:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;}
    .datetime-bar::-webkit-scrollbar{display:none;}
    .dt-label{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;}
    .dt-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:12px;font-family:inherit;color:var(--text);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .2s;}
    .dt-btn.set{border-color:var(--accent);color:var(--accent2);}
    .dt-arrow{color:var(--text2);font-size:13px;flex-shrink:0;}
    .dt-duration{background:rgba(255,92,26,.1);border:1px solid rgba(255,92,26,.3);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--accent);white-space:nowrap;flex-shrink:0;}
    .calc-btn{background:var(--accent);border:none;border-radius:8px;padding:4px 13px;font-size:12px;font-family:inherit;color:white;cursor:pointer;white-space:nowrap;flex-shrink:0;font-weight:700;margin-left:auto;transition:.2s;}
    .calc-btn:active{transform:scale(.96);}
    .calc-btn:disabled{background:var(--border);color:var(--text2);cursor:not-allowed;}

    /* MAP */
    #map{flex:1;width:100%;min-height:0;}

    /* SHEET */
    .sheet-wrap{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;height:42vh;min-height:110px;max-height:72vh;position:relative;}
    .sheet-handle-area{padding:7px 0 3px;display:flex;flex-direction:column;align-items:center;cursor:ns-resize;flex-shrink:0;}
    .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;}
    .sheet-meta{display:flex;align-items:center;justify-content:space-between;padding:3px 14px 7px;flex-shrink:0;}
    .result-count{font-size:12px;color:var(--text2);}
    .result-count strong{color:var(--accent);font-size:14px;}
    .sort-info{font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;}
    .sort-info.by-price{color:var(--accent2);border-color:rgba(255,170,0,.3);}
    .card-list{overflow-y:auto;flex:1;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;}
    .card-list::-webkit-scrollbar{width:4px;}
    .card-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

    /* RANK */
    .rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;font-family:'Space Grotesk',sans-serif;}
    .rank-1{background:#ffd700;color:#000;}
    .rank-2{background:#c0c0c0;color:#000;}
    .rank-3{background:#cd7f32;color:#fff;}
    .rank-other{background:var(--surface2);color:var(--text2);border:1px solid var(--border);font-size:11px;}

    /* CARD */
    .parking-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px;cursor:pointer;transition:border-color .2s,transform .1s;position:relative;overflow:hidden;display:flex;gap:10px;align-items:flex-start;}
    .parking-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border);}
    .parking-card.open::before{background:var(--green);}
    .parking-card.closed::before{background:var(--red);}
    .parking-card:active{transform:scale(.99);border-color:var(--accent);}
    .card-body{flex:1;min-width:0;}
    .card-row1{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px;gap:6px;}
    .card-name{font-size:13px;font-weight:700;line-height:1.3;flex:1;}
    .status-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
    .status-badge.open{background:rgba(46,204,113,.15);color:var(--green);}
    .status-badge.closed{background:rgba(231,76,60,.15);color:var(--red);}
    .status-badge.unknown{background:rgba(136,146,164,.12);color:var(--text2);}
    .card-addr{font-size:11px;color:var(--text2);margin-bottom:6px;}
    .card-stats{display:flex;gap:12px;flex-wrap:wrap;}
    .stat-item{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text2);}
    .stat-item strong{color:var(--text);font-size:12px;}
    .card-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);}
    .price-display{font-size:12px;color:var(--text2);}
    .price-display strong{color:var(--accent2);font-size:14px;font-weight:900;}
    .price-display.estimated strong{color:var(--yellow);}
    .price-display.unknown-price strong{color:var(--text2);}
    .price-note{font-size:10px;color:var(--text2);}

    /* BOTTOM NAV */
    .bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 10px;flex-shrink:0;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 0;}
    .nav-icon{font-size:20px;}
    .nav-label{font-size:10px;color:var(--text2);}
    .nav-item.active .nav-label{color:var(--accent);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:none;align-items:flex-end;}
    .modal-overlay.visible{display:flex;}
    .modal-panel{background:var(--surface);border-radius:20px 20px 0 0;width:100%;padding:20px 16px 32px;animation:slideUp .3s ease;border-top:1px solid var(--border);}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:16px;}
    .dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .dt-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}
    .dt-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:14px;outline:none;}
    .dt-field input:focus{border-color:var(--accent);}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
    .modal-btn{padding:11px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;border:1px solid var(--border);}
    .modal-btn.cancel{background:var(--surface2);color:var(--text2);}
    .modal-btn.confirm{background:var(--accent);color:white;border-color:var(--accent);font-weight:700;}

    /* DETAIL */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;}
    .detail-overlay.visible{display:flex;}
    .detail-panel{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:16px 16px 32px;animation:slideUp .3s ease;border-top:1px solid var(--border);}
    .detail-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
    .detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
    .detail-name{font-size:17px;font-weight:900;line-height:1.3;flex:1;}
    .close-btn{background:var(--surface2);border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text2);}
    .detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
    .action-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-family:inherit;color:var(--text);cursor:pointer;text-decoration:none;}
    .action-btn.primary{background:var(--accent);border-color:var(--accent);color:white;}
    .detail-section{margin-top:14px;}
    .detail-section h3{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .detail-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .detail-row:last-child{border-bottom:none;}
    .detail-row-label{color:var(--text2);}
    .detail-row-value{font-weight:600;}
    .price-calc-box{background:rgba(255,170,0,.08);border:1px solid rgba(255,170,0,.25);border-radius:10px;padding:12px;margin-top:10px;}
    .calc-total{font-size:22px;font-weight:900;color:var(--accent2);}
    .calc-sub{font-size:11px;color:var(--text2);margin-top:4px;}
    .report-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:10px;background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.25);color:#4a9eff;font-size:13px;text-decoration:none;margin-bottom:4px;transition:.2s;}
    .report-btn:active{opacity:.75;}

    /* LOADING */
    .loading-overlay{position:absolute;inset:0;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;}
    .spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:12px;color:var(--text2);}
    .empty-state{display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:10px;color:var(--text2);font-size:13px;text-align:center;}

    /* TOAST */
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--text);z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
    .toast.show{opacity:1;}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo"><div class="logo-icon">🏍</div>Bike<span>Stop</span></div>
    <div class="search-bar"><span>🔍</span><input type="text" id="searchInput" placeholder="場所・駅名で検索"/></div>
    <button class="gps-btn" id="gpsBtn">📍</button>
  </div>
</header>

<div class="datetime-bar">
  <span class="dt-label">入庫</span>
  <button class="dt-btn" id="btnIn" onclick="openModal('in')">📅 日時を設定</button>
  <span class="dt-arrow">→</span>
  <span class="dt-label">出庫</span>
  <button class="dt-btn" id="btnOut" onclick="openModal('out')">📅 日時を設定</button>
  <div class="dt-duration" id="dtDuration" style="display:none">⏱ --</div>
  <button class="calc-btn" id="calcBtn" onclick="calcAndSort()" disabled>料金順に並べる</button>
</div>

<div id="map"></div>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet-handle-area" id="sheetHandle"><div class="sheet-handle"></div></div>
  <div class="sheet-meta">
    <div class="result-count">周辺 <strong id="resultCount">0</strong> 件</div>
    <div class="sort-info" id="sortInfo">📏 距離順</div>
  </div>
  <div class="card-list" id="cardList">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div><div class="loading-text">周辺を検索中...</div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><span class="nav-icon">🗺</span><span class="nav-label">マップ</span></div>
  <div class="nav-item"><span class="nav-icon">🔖</span><span class="nav-label">お気に入り</span></div>
  <div class="nav-item"><span class="nav-icon">🕐</span><span class="nav-label">履歴</span></div>
  <div class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">設定</span></div>
</div>

<!-- DATETIME MODAL -->
<div class="modal-overlay" id="dtModal">
  <div class="modal-panel">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">入庫日時を設定</div>
    <div class="dt-grid">
      <div class="dt-field"><label>日付</label><input type="date" id="dtDate"></div>
      <div class="dt-field"><label>時刻</label><input type="time" id="dtTime" step="600"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-btn confirm" onclick="confirmDt()">決定</button>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel">
    <div class="detail-handle"></div>
    <div class="detail-header">
      <div class="detail-name" id="detailName">-</div>
      <button class="close-btn" id="closeDetail">✕</button>
    </div>
    <div id="detailBadge" style="margin-bottom:8px"></div>
    <div id="detailRating" style="font-size:13px;color:var(--text2);margin-bottom:4px"></div>
    <div id="detailPriceBox"></div>
    <div class="detail-actions">
      <a class="action-btn primary" id="naviBtn" href="#" target="_blank">🗺 ナビ開始</a>
      <button class="action-btn" id="shareBtn">📤 シェア</button>
    </div>
    <a class="report-btn" id="reportBtn" href="#" target="_blank">
      📝 料金・情報を運営に報告する
    </a>
    <div class="detail-section"><h3>基本情報</h3><div id="detailInfoRows"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_KEY = 'AIzaSyCCGXVoOMYFH4U7UMOLKO4DGexUVi0PrLA';

const SEARCH_KEYWORDS = [
  'バイク 駐輪場','二輪 駐車場','オートバイ 駐車場','バイク駐車場',
  'バイクパーク','サイクルパーク バイク','タイムズ バイク',
  'コインパーク バイク','パラカ バイク','リパーク バイク',
  '駐輪場 自動二輪','バイク置き場',
];

let map, service, geocoder, searchBox;
let markers = [];
let places = [];
let userLocation = null;
let dtIn = null, dtOut = null;
let currentModalTarget = 'in';
let sortMode = 'distance';

function initMap() {
  const def = {lat:35.6812,lng:139.7671};
  map = new google.maps.Map(document.getElementById('map'),{
    center:def,zoom:15,styles:darkMapStyle(),
    disableDefaultUI:true,zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    gestureHandling:'greedy',
  });
  service = new google.maps.places.PlacesService(map);
  geocoder = new google.maps.Geocoder();
  const input = document.getElementById('searchInput');
  searchBox = new google.maps.places.SearchBox(input);
  map.addListener('bounds_changed',()=>searchBox.setBounds(map.getBounds()));
  searchBox.addListener('places_changed',()=>{
    const ps = searchBox.getPlaces();
    if(!ps||!ps.length) return;
    const loc = ps[0].geometry.location;
    map.setCenter(loc); map.setZoom(15);
    searchNearby({lat:loc.lat(),lng:loc.lng()});
  });
  getCurrentLocation();
}

function getCurrentLocation() {
  const btn = document.getElementById('gpsBtn');
  btn.textContent='⏳';
  if(!navigator.geolocation){btn.textContent='📍';searchNearby({lat:map.getCenter().lat(),lng:map.getCenter().lng()});return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    userLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};
    map.setCenter(userLocation);map.setZoom(15);btn.textContent='📍';
    new google.maps.Marker({
      position:userLocation,map,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#4a9eff',fillOpacity:1,strokeColor:'white',strokeWeight:2},
      zIndex:1000,title:'現在地',
    });
    searchNearby(userLocation);
  },()=>{btn.textContent='📍';searchNearby({lat:map.getCenter().lat(),lng:map.getCenter().lng()});});
}

function searchNearby(location) {
  showLoading(true); clearMarkers(); places=[];
  let completed=0, allResults=[];
  SEARCH_KEYWORDS.forEach(keyword=>{
    service.nearbySearch({
      location:new google.maps.LatLng(location.lat,location.lng),
      radius:2000,keyword,language:'ja',
    },(results,status)=>{
      completed++;
      if(status===google.maps.places.PlacesServiceStatus.OK&&results) allResults=allResults.concat(results);
      if(completed===SEARCH_KEYWORDS.length){
        const seen=new Set();
        let filtered=allResults.filter(p=>{
          if(seen.has(p.place_id))return false;
          seen.add(p.place_id);return true;
        });
        // 純粋な自転車専用を除外
        filtered=filtered.filter(p=>!/自転車専用|bicycle only/i.test(p.name));
        // 距離計算
        filtered.forEach(p=>{
          const lat=p.geometry.location.lat(),lng=p.geometry.location.lng();
          p._distance=calcDistance(location.lat,location.lng,lat,lng);
          p._estimatedPrice=null;
        });
        filtered.sort((a,b)=>a._distance-b._distance);
        places=filtered;
        sortMode='distance';
        updateSortInfo();
        renderMarkers();
        renderCards(places);
        showLoading(false);
      }
    });
  });
}

function calcAndSort() {
  if(!dtIn||!dtOut)return;
  const hours=(dtOut-dtIn)/3600000;
  if(hours<=0){showToast('出庫時刻が入庫より前です');return;}
  places.forEach(p=>{p._estimatedPrice=estimatePrice(p,hours);});
  places.sort((a,b)=>{
    if(a._estimatedPrice===null&&b._estimatedPrice===null)return a._distance-b._distance;
    if(a._estimatedPrice===null)return 1;
    if(b._estimatedPrice===null)return -1;
    return a._estimatedPrice-b._estimatedPrice;
  });
  sortMode='price';
  updateSortInfo();
  renderMarkers();
  renderCards(places);
  showToast('料金順に並べ替えました');
}

function estimatePrice(place,hours) {
  const n=place.name;
  if(/無料|free/i.test(n))return 0;
  // 運営会社別の相場（関西圏）
  if(/タイムズ/i.test(n))return Math.round(110*hours);
  if(/パラカ/i.test(n))return Math.round(100*hours);
  if(/リパーク|三井/i.test(n))return Math.round(100*hours);
  if(/コインパーク|NPC/i.test(n))return Math.round(80*hours);
  if(/シャーロ|サイクルタイム/i.test(n))return Math.round(100*hours);
  if(/ナビパーク|エコロパーク/i.test(n))return Math.round(90*hours);
  if(place.user_ratings_total>30)return Math.round(100*hours);
  return null;
}

function renderMarkers() {
  clearMarkers();
  places.forEach((p,i)=>{
    const rank=i+1;
    const isOpen=p.opening_hours?.open_now;
    let bg,fg;
    if(sortMode==='price'&&p._estimatedPrice!==null){
      if(rank===1){bg='#ffd700';fg='#000';}
      else if(rank===2){bg='#c0c0c0';fg='#000';}
      else if(rank===3){bg='#cd7f32';fg='#fff';}
      else{bg='#ff5c1a';fg='#fff';}
    } else {
      bg=isOpen===false?'#e74c3c':'#ff5c1a';fg='#fff';
    }
    const label=sortMode==='price'&&p._estimatedPrice!==null
      ?`${rank}位`
      :p._distance?`${p._distance}m`:p.name.slice(0,4);

    // マーカーはオーバーレイ的なラベルで表示
    const marker=new google.maps.Marker({
      position:p.geometry.location,map,title:p.name,
      label:{text:label,color:fg,fontSize:'11px',fontWeight:'700'},
      icon:{
        path:'M 0,-12 C -6,-12 -10,-8 -10,-3 C -10,5 0,12 0,12 C 0,12 10,5 10,-3 C 10,-8 6,-12 0,-12 Z',
        fillColor:bg,fillOpacity:1,strokeColor:'rgba(0,0,0,0.3)',strokeWeight:1,scale:1.3,
        labelOrigin:new google.maps.Point(0,-2),
      },
      zIndex:10+(places.length-i),
    });
    marker.addListener('click',()=>openDetail(p));
    markers.push(marker);
  });
}

function clearMarkers(){markers.forEach(m=>m.setMap(null));markers=[];}

function renderCards(data) {
  const list=document.getElementById('cardList');
  document.getElementById('resultCount').textContent=data.length;
  if(data.length===0){
    list.innerHTML=`<div class="empty-state"><div style="font-size:36px">🏍</div><div>この周辺では見つかりませんでした</div></div>`;
    return;
  }
  list.innerHTML=data.map((p,i)=>{
    const rank=i+1;
    const isOpen=p.opening_hours?.open_now;
    const sc=isOpen===false?'closed':isOpen===true?'open':'unknown';
    const sl=isOpen===false?'営業時間外':isOpen===true?'営業中':'時間不明';
    const rankClass=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'rank-other';
    let priceHtml='';
    if(sortMode==='price'){
      if(p._estimatedPrice===0)
        priceHtml=`<div class="card-price-row"><div class="price-display"><strong>無料</strong></div><div class="price-note">${fmtHours(dtIn,dtOut)}</div></div>`;
      else if(p._estimatedPrice!==null)
        priceHtml=`<div class="card-price-row"><div class="price-display estimated"><strong>約${p._estimatedPrice}円</strong><span style="font-size:10px;color:var(--text2);margin-left:3px">推定</span></div><div class="price-note">${fmtHours(dtIn,dtOut)}</div></div>`;
      else
        priceHtml=`<div class="card-price-row"><div class="price-display unknown-price"><strong>料金不明</strong></div><div class="price-note">現地確認推奨</div></div>`;
    }
    return `<div class="parking-card ${sc}" onclick="openDetail(window._places[${i}])">
      <div class="rank-badge ${rankClass}">${rank}</div>
      <div class="card-body">
        <div class="card-row1"><div class="card-name">${escHtml(p.name)}</div><div class="status-badge ${sc}">${sl}</div></div>
        <div class="card-addr">📍 ${escHtml(p.vicinity||'')}</div>
        <div class="card-stats">
          <div class="stat-item">📏 <strong>${p._distance?p._distance+'m':'—'}</strong></div>
          <div class="stat-item">🏍 収容 <strong>—台</strong></div>
          ${p.rating?`<div class="stat-item">⭐ <strong>${p.rating}</strong></div>`:''}
        </div>
        ${priceHtml}
      </div>
    </div>`;
  }).join('');
  window._places=data;
}

function openDetail(place) {
  document.getElementById('detailName').textContent=place.name;
  const isOpen=place.opening_hours?.open_now;
  const sc=isOpen===false?'closed':isOpen===true?'open':'unknown';
  const sl=isOpen===false?'営業時間外':isOpen===true?'営業中':'時間不明';
  document.getElementById('detailBadge').innerHTML=`<span class="status-badge ${sc}">${sl}</span>`;
  document.getElementById('detailRating').textContent=place.rating?`⭐ ${place.rating}/5 (${place.user_ratings_total||0}件)`:'';

  const priceBox=document.getElementById('detailPriceBox');
  if(sortMode==='price'&&place._estimatedPrice!==null){
    priceBox.innerHTML=`<div class="price-calc-box">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${fmtHours(dtIn,dtOut)}の推定料金</div>
      <div class="calc-total">${place._estimatedPrice===0?'無料':'約'+place._estimatedPrice+'円'}</div>
      <div class="calc-sub">※推定値。実際の料金は現地でご確認ください</div>
    </div>`;
  } else priceBox.innerHTML='';

  const lat=place.geometry.location.lat(),lng=place.geometry.location.lng();
  document.getElementById('naviBtn').href=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;

  // 料金報告ボタン：フォームにバイク置き場名を自動入力
  const FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLSc0RdOrYknhHJi8tWxeGyXgZjWqvQEsxYpKKktzfDwGnjTnOA/viewform';
  const reportUrl = `${FORM_BASE}?usp=pp_url&entry.2141450232=${encodeURIComponent(place.name)}`;
  document.getElementById('reportBtn').href = reportUrl;
  document.getElementById('shareBtn').onclick=()=>{
    const url=`https://www.google.com/maps/place/?q=place_id:${place.place_id}`;
    if(navigator.share)navigator.share({title:place.name,url});
    else navigator.clipboard.writeText(url).then(()=>showToast('URLをコピーしました'));
  };

  document.getElementById('detailInfoRows').innerHTML=`
    <div class="detail-row"><span class="detail-row-label">住所</span><span class="detail-row-value">${escHtml(place.vicinity||'不明')}</span></div>
    <div class="detail-row"><span class="detail-row-label">直線距離</span><span class="detail-row-value">${place._distance?place._distance+'m':'—'}</span></div>
    <div class="detail-row"><span class="detail-row-label">収容台数</span><span class="detail-row-value">読み込み中...</span></div>`;

  service.getDetails({
    placeId:place.place_id,
    fields:['name','formatted_address','formatted_phone_number','opening_hours','website','reviews'],
    language:'ja',
  },(detail,status)=>{
    if(status!==google.maps.places.PlacesServiceStatus.OK)return;
    // 口コミから収容台数を推定
    let capacityFromReview='—';
    if(detail.reviews){
      for(const r of detail.reviews){
        const m=r.text.match(/(\d+)\s*台/);
        if(m){capacityFromReview=m[1]+'台';break;}
      }
    }
    const rows=[
      ['住所',detail.formatted_address],
      ['電話',detail.formatted_phone_number],
      ['直線距離',place._distance?place._distance+'m':'—'],
      ['収容台数',capacityFromReview],
      ['営業時間',detail.opening_hours?.weekday_text?.join(' ／ ')],
      ['ウェブサイト',detail.website?`<a href="${detail.website}" target="_blank" style="color:var(--accent)">開く</a>`:null],
    ].filter(([,v])=>v);
    document.getElementById('detailInfoRows').innerHTML=rows.map(([l,v])=>
      `<div class="detail-row"><span class="detail-row-label">${l}</span><span class="detail-row-value">${v}</span></div>`
    ).join('');
  });
  document.getElementById('detailOverlay').classList.add('visible');
}

document.getElementById('closeDetail').addEventListener('click',()=>document.getElementById('detailOverlay').classList.remove('visible'));
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('detailOverlay'))document.getElementById('detailOverlay').classList.remove('visible');});

// DATETIME
function openModal(target) {
  currentModalTarget=target;
  document.getElementById('modalTitle').textContent=target==='in'?'入庫日時を設定':'出庫日時を設定';
  const now=new Date();
  const ref=target==='in'?(dtIn||now):(dtOut||(dtIn?new Date(dtIn.getTime()+2*3600000):now));
  document.getElementById('dtDate').value=ref.toISOString().slice(0,10);
  document.getElementById('dtTime').value=ref.toTimeString().slice(0,5);
  document.getElementById('dtModal').classList.add('visible');
}
function closeModal(){document.getElementById('dtModal').classList.remove('visible');}
function confirmDt(){
  const date=document.getElementById('dtDate').value,time=document.getElementById('dtTime').value;
  if(!date||!time){showToast('日付と時刻を入力してください');return;}
  const dt=new Date(`${date}T${time}`);
  if(currentModalTarget==='in'){
    dtIn=dt;
    document.getElementById('btnIn').textContent=`📅 ${fmtDt(dt)}`;
    document.getElementById('btnIn').classList.add('set');
  } else {
    dtOut=dt;
    document.getElementById('btnOut').textContent=`📅 ${fmtDt(dt)}`;
    document.getElementById('btnOut').classList.add('set');
  }
  updateDuration(); closeModal();
}
function updateDuration(){
  const dur=document.getElementById('dtDuration'),calc=document.getElementById('calcBtn');
  if(dtIn&&dtOut){
    const diff=dtOut-dtIn;
    if(diff>0){
      const h=Math.floor(diff/3600000),m=Math.round((diff%3600000)/60000);
      dur.textContent=`⏱ ${h}時間${m>0?m+'分':''}`;
      dur.style.display='';calc.disabled=false;
    } else {dur.textContent='⚠ 時刻エラー';dur.style.display='';calc.disabled=true;}
  } else {dur.style.display='none';calc.disabled=true;}
}
function updateSortInfo(){
  const el=document.getElementById('sortInfo');
  el.textContent=sortMode==='price'?'💴 料金順':'📏 距離順';
  el.className=sortMode==='price'?'sort-info by-price':'sort-info';
}

document.getElementById('gpsBtn').addEventListener('click',()=>{if(!map)return;getCurrentLocation();});

// UTILS
function fmtDt(dt){
  const d=['日','月','火','水','木','金','土'];
  return `${dt.getMonth()+1}/${dt.getDate()}(${d[dt.getDay()]}) ${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
}
function fmtHours(i,o){
  if(!i||!o)return'';
  const diff=o-i,h=Math.floor(diff/3600000),m=Math.round((diff%3600000)/60000);
  return `${h}時間${m>0?m+'分':''}`;
}
function showLoading(show){
  const el=document.getElementById('loadingOverlay');
  if(!el)return;
  el.style.display=show?'flex':'none';
  if(show)document.getElementById('cardList').appendChild(el);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function calcDistance(a,b,c,d){
  const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// SHEET DRAG
(function(){
  const h=document.getElementById('sheetHandle'),s=document.getElementById('sheetWrap');
  let sy,sh,d=false;
  h.addEventListener('touchstart',e=>{d=true;sy=e.touches[0].clientY;sh=s.offsetHeight;},{passive:true});
  document.addEventListener('touchmove',e=>{if(!d)return;s.style.height=Math.min(Math.max(sh+(sy-e.touches[0].clientY),110),window.innerHeight*.75)+'px';},{passive:true});
  document.addEventListener('touchend',()=>{d=false;});
})();
