<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BikeStop — バイク駐輪場検索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0c10;
      --surface: #12151c;
      --surface2: #1a1e28;
      --border: #252a38;
      --accent: #ff5c1a;
      --accent2: #ffaa00;
      --text: #e8eaf0;
      --text2: #8892a4;
      --green: #2ecc71;
      --red: #e74c3c;
      --yellow: #f39c12;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; overflow:hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-icon {
      background: var(--accent);
      border-radius: 7px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo span { color: var(--accent); }
    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 10px;
      gap: 6px;
      height: 38px;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 14px;
    }
    .search-bar input::placeholder { color: var(--text2); }
    .gps-btn {
      background: var(--accent);
      border: none; border-radius: 8px;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 17px; flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .gps-btn:active { transform: scale(0.93); }
    .gps-btn.loading { background: var(--border); animation: spin 1s linear infinite; }

    /* ===== FILTER ===== */
    .filter-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex; gap: 6px;
      overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
    }
    .filter-wrap::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 4px 12px;
      font-size: 12px; font-family: inherit; color: var(--text2);
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* ===== MAP ===== */
    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* ===== BOTTOM SHEET ===== */
    .sheet-wrap {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: height 0.3s ease;
      height: 45vh;
      min-height: 120px;
      max-height: 70vh;
      position: relative;
    }
    .sheet-handle-area {
      padding: 8px 0 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: ns-resize;
      flex-shrink: 0;
    }
    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--border); border-radius: 2px;
    }
    .sheet-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 8px;
      flex-shrink: 0;
    }
    .result-count { font-size: 12px; color: var(--text2); }
    .result-count strong { color: var(--accent); font-size: 14px; }
    .sort-btn {
      background: transparent; border: 1px solid var(--border);
      border-radius: 7px; padding: 3px 10px; font-size: 11px;
      color: var(--text2); font-family: inherit; cursor: pointer;
    }
    .card-list {
      overflow-y: auto;
      flex: 1;
      padding: 0 12px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card-list::-webkit-scrollbar { width: 4px; }
    .card-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ===== PARKING CARD ===== */
    .parking-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .parking-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--border); transition: background 0.2s;
    }
    .parking-card.open::before { background: var(--green); }
    .parking-card.busy::before { background: var(--yellow); }
    .parking-card.full::before { background: var(--red); }
    .parking-card:active { transform: scale(0.99); border-color: var(--accent); }
    .card-row1 { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
    .card-name { font-size: 14px; font-weight: 700; line-height: 1.3; flex: 1; padding-right: 8px; }
    .status-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 5px; white-space: nowrap; flex-shrink: 0;
    }
    .status-badge.open { background: rgba(46,204,113,0.15); color: var(--green); }
    .status-badge.busy { background: rgba(243,156,18,0.15); color: var(--yellow); }
    .status-badge.full { background: rgba(231,76,60,0.15); color: var(--red); }
    .card-addr { font-size: 11px; color: var(--text2); margin-bottom: 7px; }
    .card-stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat-item { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text2); }
    .stat-item strong { color: var(--text); font-size: 12px; }
    .card-bottom {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    }
    .price-tag { font-size: 12px; color: var(--text2); }
    .price-tag strong { color: var(--accent2); font-size: 13px; }
    .distance-tag { font-size: 11px; color: var(--text2); }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 6px 0 10px;
      flex-shrink: 0;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 2px; cursor: pointer; padding: 3px 0;
    }
    .nav-icon { font-size: 20px; }
    .nav-label { font-size: 10px; color: var(--text2); }
    .nav-item.active .nav-label { color: var(--accent); }

    /* ===== DETAIL OVERLAY ===== */
    .detail-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200; display: none; align-items: flex-end;
    }
    .detail-overlay.visible { display: flex; }
    .detail-panel {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%; max-height: 80vh; overflow-y: auto;
      padding: 16px 16px 32px;
      animation: slideUp 0.3s ease;
      border-top: 1px solid var(--border);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .detail-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
    .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .detail-name { font-size: 17px; font-weight: 900; line-height: 1.3; flex: 1; }
    .close-btn {
      background: var(--surface2); border: none; border-radius: 50%;
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; color: var(--text2); flex-shrink: 0;
    }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .action-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px; display: flex; align-items: center;
      justify-content: center; gap: 5px; font-size: 13px; font-family: inherit;
      color: var(--text); cursor: pointer; transition: opacity 0.2s; text-decoration: none;
    }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .action-btn:hover { opacity: 0.85; }
    .detail-section { margin-top: 14px; }
    .detail-section h3 { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row-label { color: var(--text2); }
    .detail-row-value { font-weight: 600; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 18px; font-size: 13px; color: var(--text);
      z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ===== LOADING ===== */
    .loading-overlay {
      position: absolute; inset: 0;
      background: var(--surface2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; z-index: 50; border-radius: 12px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; color: var(--text2); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      padding: 30px 20px; gap: 10px; color: var(--text2); font-size: 13px; text-align: center;
    }
    .empty-icon { font-size: 36px; }

    /* Google Maps カスタムスタイル */
    .gm-style .gm-style-iw-c { background: var(--surface) !important; border-radius: 10px !important; padding: 0 !important; }
    .gm-style .gm-style-iw-d { overflow: hidden !important; }
    .gm-style .gm-style-iw-tc::after { background: var(--surface) !important; }
    .custom-marker-label {
      background: var(--accent);
      color: white;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(255,92,26,0.5);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🏍</div>
      Bike<span>Stop</span>
    </div>
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="場所・駅名で検索" />
    </div>
    <button class="gps-btn" id="gpsBtn">📍</button>
  </div>
</header>

<div class="filter-wrap">
  <button class="filter-chip active" data-filter="all">すべて</button>
  <button class="filter-chip" data-filter="parking">駐輪場</button>
  <button class="filter-chip" data-filter="motorcycle">バイク専用</button>
  <button class="filter-chip" data-filter="gas">ガソリンスタンド</button>
  <button class="filter-chip" data-filter="repair">整備・修理</button>
</div>

<div id="map"></div>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet-handle-area" id="sheetHandle">
    <div class="sheet-handle"></div>
  </div>
  <div class="sheet-meta">
    <div class="result-count">周辺 <strong id="resultCount">0</strong> 件</div>
    <button class="sort-btn" id="sortBtn">↕ 距離順</button>
  </div>
  <div class="card-list" id="cardList">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">周辺を検索中...</div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><span class="nav-icon">🗺</span><span class="nav-label">マップ</span></div>
  <div class="nav-item"><span class="nav-icon">🔖</span><span class="nav-label">お気に入り</span></div>
  <div class="nav-item"><span class="nav-icon">🕐</span><span class="nav-label">履歴</span></div>
  <div class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">設定</span></div>
</div>

<!-- DETAIL PANEL -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel">
    <div class="detail-handle"></div>
    <div class="detail-header">
      <div class="detail-name" id="detailName">-</div>
      <button class="close-btn" id="closeDetail">✕</button>
    </div>
    <div id="detailBadge" style="margin-bottom:8px"></div>
    <div id="detailRating" style="font-size:13px;color:var(--text2);margin-bottom:4px"></div>
    <div class="detail-actions">
      <a class="action-btn primary" id="naviBtn" href="#" target="_blank">🗺 Googleマップで開く</a>
      <button class="action-btn" id="shareBtn">📤 シェア</button>
    </div>
    <div class="detail-section">
      <h3>基本情報</h3>
      <div id="detailInfoRows"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_KEY = 'AIzaSyCCGXVoOMYFH4U7UMOLKO4DGexUVi0PrLA';

let map, service, geocoder, searchBox;
let markers = [];
let places = [];
let userLocation = null;
let activeFilter = 'all';
let sortBy = 'distance';
let currentDetail = null;

// フィルターキーワードマッピング
const filterQueries = {
  all: ['バイク 駐輪場', 'オートバイ 駐車場', '二輪 駐車場'],
  parking: ['バイク 駐輪場', '二輪 駐車場'],
  motorcycle: ['バイク専用 駐車場', 'オートバイ専用'],
  gas: ['ガソリンスタンド', 'セルフ ガソリンスタンド'],
  repair: ['バイク 修理', 'オートバイ 整備', 'バイクショップ'],
};

// ===== MAP INIT =====
function initMap() {
  const defaultCenter = { lat: 35.6812, lng: 139.7671 }; // 東京

  map = new google.maps.Map(document.getElementById('map'), {
    center: defaultCenter,
    zoom: 15,
    styles: darkMapStyle(),
    disableDefaultUI: true,
    zoomControl: true,
    zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
    gestureHandling: 'greedy',
  });

  service = new google.maps.places.PlacesService(map);
  geocoder = new google.maps.Geocoder();

  // 検索ボックス連携
  const input = document.getElementById('searchInput');
  searchBox = new google.maps.places.SearchBox(input);
  map.addListener('bounds_changed', () => searchBox.setBounds(map.getBounds()));

  searchBox.addListener('places_changed', () => {
    const ps = searchBox.getPlaces();
    if (!ps || ps.length === 0) return;
    const loc = ps[0].geometry.location;
    map.setCenter(loc);
    map.setZoom(15);
    searchNearby(loc);
  });

  // 現在地取得を自動で試みる
  getCurrentLocation();
}

// ===== 現在地取得 =====
function getCurrentLocation() {
  const btn = document.getElementById('gpsBtn');
  btn.textContent = '⏳';
  btn.classList.add('loading');

  if (!navigator.geolocation) {
    showToast('位置情報が使えません');
    btn.textContent = '📍';
    btn.classList.remove('loading');
    searchNearby(map.getCenter());
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.setCenter(userLocation);
      map.setZoom(15);
      btn.textContent = '📍';
      btn.classList.remove('loading');

      // 現在地マーカー
      new google.maps.Marker({
        position: userLocation,
        map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: '#4a9eff',
          fillOpacity: 1,
          strokeColor: 'white',
          strokeWeight: 2,
        },
        zIndex: 1000,
        title: '現在地',
      });

      searchNearby(userLocation);
    },
    (err) => {
      btn.textContent = '📍';
      btn.classList.remove('loading');
      showToast('位置情報を取得できませんでした');
      searchNearby(map.getCenter());
    },
    { timeout: 8000, enableHighAccuracy: true }
  );
}

// ===== 周辺検索 =====
function searchNearby(location) {
  showLoading(true);
  clearMarkers();
  places = [];

  const queries = filterQueries[activeFilter] || filterQueries.all;
  let completed = 0;
  let allResults = [];

  queries.forEach(keyword => {
    const request = {
      location,
      radius: 1500,
      keyword,
      language: 'ja',
    };

    service.nearbySearch(request, (results, status) => {
      completed++;
      if (status === google.maps.places.PlacesServiceStatus.OK && results) {
        allResults = allResults.concat(results);
      }

      if (completed === queries.length) {
        // 重複除去
        const seen = new Set();
        places = allResults.filter(p => {
          if (seen.has(p.place_id)) return false;
          seen.add(p.place_id);
          return true;
        });

        // 距離計算
        if (userLocation || location) {
          const ref = userLocation || location;
          places.forEach(p => {
            const lat = p.geometry.location.lat();
            const lng = p.geometry.location.lng();
            p._distance = calcDistance(ref.lat, ref.lng, lat, lng);
          });
          places.sort((a, b) => a._distance - b._distance);
        }

        renderMarkers();
        renderCards(places);
        showLoading(false);
      }
    });
  });
}

// ===== マーカー描画 =====
function renderMarkers() {
  clearMarkers();
  places.forEach((place, i) => {
    const isOpen = place.opening_hours?.open_now;
    const color = isOpen === false ? '#e74c3c' : isOpen === true ? '#2ecc71' : '#ff5c1a';

    const marker = new google.maps.Marker({
      position: place.geometry.location,
      map,
      title: place.name,
      label: {
        text: place._distance ? `${place._distance}m` : place.name.slice(0, 4),
        className: 'custom-marker-label',
        color: 'white',
        fontSize: '11px',
        fontWeight: '700',
      },
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 0,
      },
      zIndex: 10 + (places.length - i),
    });

    marker.addListener('click', () => openDetail(place));
    markers.push(marker);
  });
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

// ===== カード描画 =====
function renderCards(data) {
  const list = document.getElementById('cardList');
  document.getElementById('resultCount').textContent = data.length;

  if (data.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🏍</div>
      <div>この周辺では見つかりませんでした</div>
      <div style="font-size:11px">検索範囲を変えてみてください</div>
    </div>`;
    return;
  }

  list.innerHTML = data.map((p, i) => {
    const isOpen = p.opening_hours?.open_now;
    const statusClass = isOpen === false ? 'full' : isOpen === true ? 'open' : 'busy';
    const statusLabel = isOpen === false ? '営業時間外' : isOpen === true ? '営業中' : '時間不明';
    const rating = p.rating ? `⭐ ${p.rating} (${p.user_ratings_total || 0}件)` : '';
    const dist = p._distance ? `📏 ${p._distance}m` : '';
    const price = p.price_level != null ? ['無料','安価','普通','やや高','高価'][p.price_level] || '' : '';

    return `
    <div class="parking-card ${statusClass}" onclick="openDetail(window._places[${i}])">
      <div class="card-row1">
        <div class="card-name">${escHtml(p.name)}</div>
        <div class="status-badge ${statusClass}">${statusLabel}</div>
      </div>
      <div class="card-addr">📍 ${escHtml(p.vicinity || '')}</div>
      <div class="card-stats">
        ${rating ? `<div class="stat-item">${rating}</div>` : ''}
        ${dist ? `<div class="stat-item">${dist}</div>` : ''}
      </div>
      ${(price || dist) ? `
      <div class="card-bottom">
        <div class="price-tag">${price ? `💴 <strong>${price}</strong>` : ''}</div>
        <div class="distance-tag">${dist}</div>
      </div>` : ''}
    </div>`;
  }).join('');

  // グローバル参照（クリックハンドラ用）
  window._places = data;
}

// ===== 詳細パネル =====
function openDetail(place) {
  currentDetail = place;

  document.getElementById('detailName').textContent = place.name;

  const isOpen = place.opening_hours?.open_now;
  const statusClass = isOpen === false ? 'full' : isOpen === true ? 'open' : 'busy';
  const statusLabel = isOpen === false ? '営業時間外' : isOpen === true ? '営業中' : '時間不明';
  document.getElementById('detailBadge').innerHTML =
    `<span class="status-badge ${statusClass}">${statusLabel}</span>`;

  document.getElementById('detailRating').textContent =
    place.rating ? `⭐ ${place.rating} / 5  (${place.user_ratings_total || 0}件のレビュー)` : '';

  // Googleマップリンク
  const lat = place.geometry.location.lat();
  const lng = place.geometry.location.lng();
  document.getElementById('naviBtn').href =
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;

  // シェア
  document.getElementById('shareBtn').onclick = () => {
    const url = `https://www.google.com/maps/place/?q=place_id:${place.place_id}`;
    if (navigator.share) {
      navigator.share({ title: place.name, url });
    } else {
      navigator.clipboard.writeText(url).then(() => showToast('URLをコピーしました'));
    }
  };

  // 詳細情報取得
  document.getElementById('detailInfoRows').innerHTML =
    `<div class="detail-row"><span class="detail-row-label">住所</span><span class="detail-row-value">${escHtml(place.vicinity || '不明')}</span></div>`;

  service.getDetails({
    placeId: place.place_id,
    fields: ['name', 'formatted_address', 'formatted_phone_number', 'opening_hours', 'website', 'url'],
    language: 'ja',
  }, (detail, status) => {
    if (status !== google.maps.places.PlacesServiceStatus.OK) return;

    const rows = [
      ['住所', detail.formatted_address],
      ['電話', detail.formatted_phone_number],
      ['営業時間', detail.opening_hours?.weekday_text?.join(' / ')],
      ['ウェブサイト', detail.website ? `<a href="${detail.website}" target="_blank" style="color:var(--accent)">開く</a>` : null],
    ].filter(([, v]) => v);

    document.getElementById('detailInfoRows').innerHTML = rows.map(([l, v]) =>
      `<div class="detail-row"><span class="detail-row-label">${l}</span><span class="detail-row-value">${v}</span></div>`
    ).join('');
  });

  document.getElementById('detailOverlay').classList.add('visible');
}

document.getElementById('closeDetail').addEventListener('click', () => {
  document.getElementById('detailOverlay').classList.remove('visible');
});
document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('detailOverlay'))
    document.getElementById('detailOverlay').classList.remove('visible');
});

// ===== GPS ボタン =====
document.getElementById('gpsBtn').addEventListener('click', () => {
  if (!map) { showToast('マップ読み込み中です…'); return; }
  getCurrentLocation();
});

// ===== フィルター =====
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!map) { showToast('マップ読み込み中です…'); return; }
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    const c = map.getCenter();
    const center = userLocation || { lat: c.lat(), lng: c.lng() };
    searchNearby(center);
  });
});

// ===== ソート =====
document.getElementById('sortBtn').addEventListener('click', () => {
  if (!map) return;
  sortBy = sortBy === 'distance' ? 'rating' : 'distance';
  document.getElementById('sortBtn').textContent = sortBy === 'distance' ? '↕ 距離順' : '↕ 評価順';
  if (sortBy === 'rating') {
    places.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else {
    places.sort((a, b) => (a._distance || 9999) - (b._distance || 9999));
  }
  renderCards(places);
});

// ===== ユーティリティ =====
function showLoading(show) {
  const el = document.getElementById('loadingOverlay');
  if (!el) return;
  if (show) {
    el.style.display = 'flex';
    document.getElementById('cardList').appendChild(el);
  } else {
    el.style.display = 'none';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== シートのドラッグリサイズ =====
(function() {
  const handle = document.getElementById('sheetHandle');
  const sheet = document.getElementById('sheetWrap');
  let startY, startH, dragging = false;

  handle.addEventListener('touchstart', e => {
    dragging = true;
    startY = e.touches[0].clientY;
    startH = sheet.offsetHeight;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = startY - e.touches[0].clientY;
    const newH = Math.min(Math.max(startH + dy, 120), window.innerHeight * 0.75);
    sheet.style.height = newH + 'px';
  }, { passive: true });

  document.addEventListener('touchend', () => { dragging = false; });
})();
</script>
